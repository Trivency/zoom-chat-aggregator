# CI — runs automatically on every pull request and every push to main.
# Two independent jobs: backend syntax check + tests, and a client
# production build. Either failing marks the PR with a red X.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips the postinstall client build; the client
      # gets built (and thus checked) in its own job below.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax-check all backend sources
        run: |
          find src scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
